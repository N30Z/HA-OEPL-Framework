name: Validate with HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # This repo is distributed as a HACS custom repository, not (yet)
          # submitted to the official HACS default store, so the two
          # store-readiness checks that require external, repo-owner-only
          # actions are skipped here:
          #   - topics: requires setting GitHub repo topics in Settings
          #   - brands: requires a separate PR to home-assistant/brands
          # Remove this "ignore" once those are done and default-store
          # submission is desired.
          ignore: "brands topics"
